<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beta interpreter workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,300..700&family=Martian+Mono:wdth,wght@75..100,300..600&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true" class="glyph">
          <circle cx="16" cy="16" r="13" class="g-ring" />
          <path d="M6 23 L12 13 L16 18 L21 8 L26 23" class="g-line" />
          <circle cx="21" cy="8" r="2" class="g-dot" />
        </svg>
        <h1>Beta interpreter <span>workbench</span></h1>
      </div>
      <p class="sysline" id="sysline" aria-live="polite"></p>
    </header>

    <nav class="tabs-main" id="tabs" aria-label="Views"></nav>

    <main class="dash" id="dash">
      <section class="core a-core" aria-label="Beta and gauge">
        <div class="input">
          <label for="beta" class="input-label">
            <span>Beta</span>
            <span class="hint">Kept in this tab only. Nothing you paste is saved.</span>
          </label>
          <textarea id="beta" spellcheck="false" autocomplete="off" rows="4" placeholder="Paste or type a beta"></textarea>
        </div>
        <div class="radial">
          <div class="stats stats-left">
            <button type="button" class="stat" data-open="movements" data-link="a-movements">
              <span class="v" id="s-movements"></span><span class="l">Movements</span>
            </button>
            <button type="button" class="stat" data-open="steps" data-link="a-steps">
              <span class="v" id="s-steps"></span><span class="l">Steps</span>
            </button>
          </div>
          <svg class="gauge" id="gauge" viewBox="0 0 200 200" role="img" aria-labelledby="gauge-title">
            <title id="gauge-title">Recognised words and confidence in the reading</title>
          </svg>
          <div class="stats stats-right">
            <button type="button" class="stat" data-open="questions" data-link="a-questions">
              <span class="v" id="s-questions"></span><span class="l">Questions</span>
            </button>
            <button type="button" class="stat" data-open="vocabulary" data-link="a-vocab">
              <span class="v" id="s-vocab"></span><span class="l">Vocabulary changes</span>
            </button>
          </div>
        </div>
        <div class="stats stats-below">
          <button type="button" class="stat" data-open="reading" data-link="a-trace" data-place="below">
            <span class="v" id="s-tokens"></span><span class="l">Tokens</span>
          </button>
        </div>
      </section>

      <section class="card a-movements" aria-labelledby="t-movements">
        <header class="card-head">
          <h2 id="t-movements">Movements</h2>
          <button type="button" class="open" data-open="movements">Details</button>
        </header>
        <div class="card-body" id="c-movements"></div>
      </section>

      <section class="card a-steps" aria-labelledby="t-steps">
        <header class="card-head">
          <h2 id="t-steps">Steps</h2>
          <button type="button" class="open" data-open="steps">Details</button>
        </header>
        <div class="card-body" id="c-steps"></div>
      </section>

      <section class="card a-questions" aria-labelledby="t-questions">
        <header class="card-head">
          <h2 id="t-questions">Open questions</h2>
          <button type="button" class="open" data-open="questions">Details</button>
        </header>
        <div class="card-body" id="c-questions"></div>
      </section>


      <section class="card a-vocab" aria-labelledby="t-vocab">
        <header class="card-head">
          <h2 id="t-vocab">Vocabulary</h2>
          <button type="button" class="open" data-open="vocabulary">Details</button>
        </header>
        <div class="card-body" id="c-vocab"></div>
      </section>

      <section class="card a-trace" aria-labelledby="t-trace">
        <header class="card-head">
          <h2 id="t-trace">Reading</h2>
          <div class="trace-summary" id="c-spectrum"></div>
          <button type="button" class="open" data-open="reading">Details</button>
        </header>
        <div class="tape-wrap"><ol class="tape" id="tape" aria-label="Token trace"></ol></div>
      </section>
      <svg class="links" id="links" aria-hidden="true"></svg>
    </main>

    <section class="detail" id="detail" aria-label="Details" hidden>
      <div class="detail-body" id="detail-body"></div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
