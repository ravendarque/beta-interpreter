<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beta interpreter workbench</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@75..125,300..700&family=Martian+Mono:wdth,wght@75..100,300..600&display=swap"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="mark">
        <svg viewBox="0 0 32 32" aria-hidden="true" class="glyph">
          <circle cx="16" cy="16" r="13" class="g-ring" />
          <path d="M6 23 L12 13 L16 18 L21 8 L26 23" class="g-line" />
          <circle cx="21" cy="8" r="2" class="g-dot" />
        </svg>
        <h1>Beta interpreter <span>workbench</span></h1>
      </div>
      <p class="sysline" id="sysline" aria-live="polite"></p>
    </header>

    <main class="dash" id="dash">
      <section class="card a-reading" aria-labelledby="t-reading">
        <header class="card-head">
          <h2 id="t-reading">Reading</h2>
          <button type="button" class="open" data-open="reading">Details</button>
        </header>
        <div class="card-body" id="c-reading"></div>
      </section>

      <section class="card a-questions" aria-labelledby="t-questions">
        <header class="card-head">
          <h2 id="t-questions">Open questions</h2>
          <button type="button" class="open" data-open="questions">Details</button>
        </header>
        <div class="card-body" id="c-questions"></div>
      </section>

      <section class="core a-core" aria-label="Beta and scope">
        <div class="scope-wrap">
          <svg class="scope" id="scope" viewBox="0 0 400 400" role="img" aria-labelledby="scope-title">
            <title id="scope-title">Scope: each token as an arc, coloured by how it was read</title>
          </svg>
          <dl class="readouts" id="readouts"></dl>
        </div>
        <div class="input">
          <label for="beta" class="input-label">
            <span>Beta</span>
            <span class="hint">Kept in this tab only. Nothing you paste is saved.</span>
          </label>
          <textarea id="beta" spellcheck="false" autocomplete="off" rows="4"></textarea>
          <div class="samples" id="samples" aria-label="Sample betas"></div>
        </div>
      </section>

      <section class="card a-movements" aria-labelledby="t-movements">
        <header class="card-head">
          <h2 id="t-movements">Movements</h2>
          <button type="button" class="open" data-open="movements">Details</button>
        </header>
        <div class="card-body" id="c-movements"></div>
      </section>

      <form class="card a-rate" id="rating" aria-labelledby="t-rate">
        <header class="card-head">
          <h2 id="t-rate">Rate reading</h2>
          <span class="figure-sm" id="rating-history"></span>
        </header>
        <div class="card-body rate-body">
          <fieldset class="score">
            <legend class="visually-hidden">Overall score</legend>
            <div class="score-row" id="score"></div>
          </fieldset>
          <fieldset class="tags">
            <legend class="visually-hidden">What went wrong</legend>
            <div class="tag-row" id="tags"></div>
          </fieldset>
          <div class="rate-foot">
            <button type="submit" class="primary" id="save-rating" disabled>Save rating</button>
            <span class="status" id="rating-status" role="status"></span>
          </div>
        </div>
      </form>

      <section class="card a-vocab" aria-labelledby="t-vocab">
        <header class="card-head">
          <h2 id="t-vocab">Vocabulary</h2>
          <button type="button" class="open" data-open="vocabulary">Details</button>
        </header>
        <div class="card-body" id="c-vocab"></div>
      </section>

      <section class="card a-trace" aria-labelledby="t-trace">
        <header class="card-head">
          <h2 id="t-trace">Token trace</h2>
          <button type="button" class="open" data-open="reading">Details</button>
        </header>
        <div class="tape-wrap"><ol class="tape" id="tape" aria-label="Token trace"></ol></div>
      </section>
    </main>

    <section class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" hidden>
      <header class="detail-head">
        <h2 id="detail-title" class="visually-hidden">Details</h2>
        <nav class="detail-tabs" id="detail-tabs" aria-label="Detail views"></nav>
        <button type="button" class="close" id="detail-close" aria-label="Close details">Close</button>
      </header>
      <div class="detail-body" id="detail-body"></div>
    </section>

    <div class="toast" id="toast" role="status" hidden></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
